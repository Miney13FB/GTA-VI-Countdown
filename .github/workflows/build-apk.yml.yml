name: Build GTA VI Countdown APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run tests and build APK
        run: gradle --no-daemon --build-cache --parallel testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p output
          cp "$APK" output/GTA6Countdown-v3.2.apk
          sha256sum output/GTA6Countdown-v3.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA6Countdown-v3.2
          path: output/GTA6Countdown-v3.2.apk
          if-no-files-found: error
          retention-days: 30
