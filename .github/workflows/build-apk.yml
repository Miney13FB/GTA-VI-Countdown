name: Build GTA VI Countdown APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project, run tests and build APK
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GTA6Countdown.zip"
          if [ ! -s "$ZIP_FILE" ]; then
            echo "ERROR: No se encuentra $ZIP_FILE en la raíz del repositorio."
            echo "Archivos disponibles:"
            find . -maxdepth 2 -type f -print | sort
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: El ZIP no contiene settings.gradle(.kts)."
            find extracted -maxdepth 5 -type f -print | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Se encontró Gradle, pero no el módulo app/."
            find "$PROJECT_DIR" -maxdepth 4 -type f -print | sort
            exit 1
          fi

          echo "Proyecto Android localizado en: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          gradle --no-daemon --build-cache --parallel \
            testDebugUnitTest assembleDebug --stacktrace

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: Gradle terminó, pero no se encontró el APK de depuración."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/GTA6Countdown-v3.2.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="output/GTA6Countdown-v3.2.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA6Countdown-v3.2
          path: output/GTA6Countdown-v3.2.apk
          if-no-files-found: error
          retention-days: 30
