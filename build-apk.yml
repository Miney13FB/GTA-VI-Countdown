name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Descomprimir y compilar
        run: |
          unzip -q "$(ls *.zip | head -n1)" -d proyecto
          cd "$(dirname "$(find proyecto -name settings.gradle.kts | head -n1)")"
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA6-Countdown-APK
          path: proyecto/**/app-debug.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GTA VI Countdown (build ${{ github.run_number }})
          files: proyecto/**/app-debug.apk
