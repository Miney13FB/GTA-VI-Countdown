name: Build GTA VI Countdown APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile, test and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Extract project and run tests
        shell: bash
        run: |
          set -euo pipefail
          unzip -q GTA6Countdown_GitHub_Actions.zip -d project
          test -f project/settings.gradle.kts
          cd project
          gradle --no-daemon --build-cache --parallel testDebugUnitTest assembleDebug --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p output
          cp "$APK" output/GTA6Countdown-v3.1.apk
          sha256sum output/GTA6Countdown-v3.1.apk

      - name: Upload APK for direct download
        uses: actions/upload-artifact@v7
        with:
          path: output/GTA6Countdown-v3.1.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
